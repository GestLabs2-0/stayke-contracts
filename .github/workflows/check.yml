name: 'Check before PR'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

on:
  pull_request:
  push:
    branches: [main, dev, staging]

jobs: 
  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: solana-developers/github-actions/setup-all@v0.2.10
        with:
          solana_version: "3.0.2"
          anchor_version: "1.0.2"

      - name: Build Anchor programs
        run: anchor build --ignore-keys

      - name: Stage artifacts for sharing
        run: |
          mkdir -p artifact
          cp -v target/deploy/*.so artifact/
          cp -v target/idl/*.json artifact/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-programs
          path: artifact/

  check:
    needs: anchor-build
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target
          key: v0001-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v0001-rust-${{ hashFiles('rust-toolchain.toml') }}

      - name: Set rust version
        run: |
          if [ ! -f rust-toolchain.toml ]; then
            echo "ERROR: rust-toolchain.toml not found"
            exit 1
          fi
          RUST_VERSION="$(grep -oP 'channel = "\K\d\.\d+\.\d+(?=")' rust-toolchain.toml)"
          if [ -z "$RUST_VERSION" ]; then
            echo "ERROR: Could not parse Rust version"
            exit 1
          fi
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: actions/download-artifact@v4
        with:
          name: anchor-programs
          path: artifact/

      - name: Restore artifacts to expected paths
        run: |
          mkdir -p target/deploy target/idl
          cp -v artifact/*.so target/deploy/
          cp -v artifact/*.json target/idl/ 2>/dev/null || true

      - name: Verify artifact paths
        run: |
          echo "=== target/deploy/ ==="
          ls -la target/deploy/
          echo "=== target/idl/ ==="
          ls -la target/idl/ 2>/dev/null || echo "no idl"
          echo "=== resolve include_bytes path ==="
          ls -la programs/stayke-escrow/tests/../../../target/deploy/stayke_escrow.so

      - name: cargo tree
        run: |
          cargo tree
          git checkout Cargo.lock
          cargo tree --frozen --offline

      - name: Run fmt
        run: cargo +nightly fmt --all -- --check

      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Run clippy
        run: cargo clippy --all-targets --tests -- -Dwarnings
      
      - name: Run tests
        run: cargo test --all-targets
