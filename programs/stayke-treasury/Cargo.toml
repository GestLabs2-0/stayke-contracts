[package]
name = "stayke-treasury"
version = "0.1.0"
description = "Treasury library for Stayke, containing treasury and lending core logic"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stayke_treasury"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.0-rc.3", features = ["init-if-needed"] }
anchor-spl = "1.0.0-rc.3"
stayke-core = { path = "../stayke-core", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
