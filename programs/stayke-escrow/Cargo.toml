[package]
name = "stayke-escrow"
version = "0.1.0"
description = "Escrow library for Stayke, containing escrow and bookings core logic"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stayke_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "stayke-core/idl-build", 'stayke-config/idl-build']
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
stayke-core = { path = "../stayke-core", features = ["cpi"] }
stayke-config = { path = "../stayke-config", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.12.0"
solana-account = "3.2"
solana-hash = "3.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-program = "3"
solana-pubkey = "3.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
